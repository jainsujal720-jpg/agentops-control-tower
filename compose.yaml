services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentops}
      POSTGRES_USER: ${POSTGRES_USER:-agentops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_before_deploy}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://agentops:local_dev_only_change_before_deploy@db:5432/agentops}
      RELAYGUARD_BASE_URL: ${RELAYGUARD_BASE_URL:-http://host.docker.internal:8100}
      RELAYGUARD_API_KEY: ${RELAYGUARD_API_KEY:-}
      RELAYGUARD_TIMEOUT_SECONDS: ${RELAYGUARD_TIMEOUT_SECONDS:-60}
      AGENTOPS_TENANT_ID: ${AGENTOPS_TENANT_ID:-acme}
      AGENTOPS_USER_ID: ${AGENTOPS_USER_ID:-agentops-demo}
      AGENTOPS_TASK_CLASS: ${AGENTOPS_TASK_CLASS:-complex}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
