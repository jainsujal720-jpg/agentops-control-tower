[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops-control-tower-api"
version = "0.1.0"
description = "Backend foundation for the AgentOps Control Tower prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
